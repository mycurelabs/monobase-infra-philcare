# Default values for monobase-infrastructure Helm chart
# These control cluster-wide infrastructure components
# Note: argocd.repoURL is injected from infrastructure-root.yaml bootstrap file

# Ops-plane placement — this example cluster has a dedicated `infra` node pool,
# so pin the infrastructure operators to it. A cluster without this taxonomy
# omits `infra` entirely (chart default is neutral → schedule anywhere).
infra:
  nodeSelector:
    node-pool: infra
  tolerations:
    - key: node-pool
      operator: Equal
      value: infra
      effect: NoSchedule

# Cert Manager - TLS certificate automation
certManager:
  enabled: true
  version: v1.16.2

# Cert Manager Resources - ClusterIssuers and certificate configuration
certManagerIssuers:
  enabled: true
  issuers:
    # HTTP-01 challenge type (no DNS provider needed)
    - name: letsencrypt-prod
      email: "admin@example.com"
      server: production
      provider: http01
    
    - name: letsencrypt-staging
      email: "admin@example.com"
      server: staging
      provider: http01

    # HTTP-01 challenge via NGINX Gateway (for domains routed through NGINX)
    - name: letsencrypt-nginx-http01
      email: "admin@example.com"
      server: production
      provider: http01
      http01:
        gatewayName: nginx-public-gateway
        gatewayNamespace: nginx-gateway-system

    # Cloudflare DNS-01 challenge (for wildcard and multi-level subdomains)
    - name: letsencrypt-production
      email: "admin@example.com"
      server: production
      provider: cloudflare
      cloudflare:
        apiTokenSecretRef:
          name: cloudflare-api-token
          key: api-token
        dnsZones:
          - example.com
          - example.org

# CoreDNS overrides (coredns-custom hook) — cadence-relay hairpin rewrites.
# Manifests: infrastructure/coredns/
corednsCustom:
  enabled: true

# NGINX Gateway Fabric - primary Gateway API implementation
nginxGateway:
  enabled: true
  # Keep in lockstep with the Gateway API CRD bundle —
  # scripts/upgrade-gateway-api-crds.sh (2.6.7 -> Gateway API 1.5.1).
  # 2.6.x picks up the 2.5 L4 route fixes needed before cadence QUIC
  # (UDPRoute) rides the shared gateway; 2.4.x shipped the first UDP cut.
  version: "2.6.7"

# NGINX Gateway Resources
nginxGatewayResources:
  gatewayClass:
    enabled: false  # GatewayClass created by operator chart

  # PUBLIC gateway — prod only, internet-exposed BY INTENT. Named for its role
  # (public) vs the internal gateway below. Nonprod/internal listeners live on
  # nginx-internal-gateway (deny-first default).
  gateway:
    name: nginx-public-gateway
    namespace: nginx-gateway-system
    gatewayClassName: nginx
    # AWS NLB (internet-facing, IP targets). For a stable IP, pre-allocate
    # Elastic IPs and set eip-allocations (docs/infrastructure/static-ip-aws.md)
    # so DNS and the cadence publicAddr survive gateway re-creations. Keep these
    # annotations stable.
    infrastructure:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "external"
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
        # service.beta.kubernetes.io/aws-load-balancer-eip-allocations: "<eipalloc-id>"
    listeners:
      # Production example.com
      - name: https-wildcard
        port: 443
        protocol: HTTPS
        hostname: "*.example.com"
        tlsSecretName: nginx-gateway-tls-prod
      - name: http-wildcard
        port: 80
        protocol: HTTP
        hostname: "*.example.com"
      # Cadence QUIC (UDPRoute; cadence LB consolidation). UDP has no SNI, so
      # envs are demuxed by port: prod keeps the canonical 6472 here; staging's
      # 6473 lives on the internal gateway. The cadence chart attaches a UDPRoute
      # via sectionName; publicAddr in the deployment values advertises
      # <shared-LB-IP>:<port>. NGF adds these ports to its LB Service (the cloud
      # LB updates in place, IP stable). Never add a TCP listener on these port
      # numbers (some cloud CCMs mishandle same-port TCP+UDP updates).
      - name: cadence-quic-prod
        port: 6472
        protocol: UDP
      # Prod relay QUIC — iroh's DEFAULT 7842. Free on the public gateway because
      # the staging relay lives on the internal gateway, so no port collision and
      # no relay_quic_port advertisement needed: boxes probe the default.
      - name: relay-quic-prod
        port: 7842
        protocol: UDP
      # Production example.com
      - name: https-app
        port: 443
        protocol: HTTPS
        hostname: "*.example.com"
        tlsSecretName: nginx-gateway-tls-prod-app
      - name: http-app
        port: 80
        protocol: HTTP
        hostname: "*.example.com"

  # INTERNAL gateway — the CLUSTER-DEFAULT ingress (deny-first): every
  # deployment's routes land here unless the deployment explicitly opts into
  # the public shared gateway above (prod does, tagged PUBLIC). ClusterIP data
  # plane (never a cloud LB). Private access is provider-agnostic — today the
  # Tailscale operator exposes it on the private network (devs + boxes hit the
  # device's 100.x IP); a VPN/subnet-router could front the same Service later.
  extraGateways:
    - name: nginx-internal-gateway
      gatewayClassName: nginx
      annotations:
        # external-dns publishes attached routes' hostnames with THIS target
        # (the gateway's Tailscale device IP) instead of the Gateway's status
        # address (a ClusterIP, useless off-cluster).
        external-dns.alpha.kubernetes.io/target: "<tailnet-ip>"
      infrastructure:
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: "nginx-internal-gateway"
      nginxProxy:
        serviceType: ClusterIP
        # Non-prod-grade availability; the tailscale proxy pod is single anyway.
        replicas: 1
      listeners:
        # Exact-hostname listeners for the staging app<->api pair. These MUST
        # stay single-hostname to prevent HTTP/2 connection coalescing between
        # the app and api virtual hosts.
        - name: https-staging-mycure
          port: 443
          protocol: HTTPS
          hostname: "mycure.staging.example.com"
          tlsSecretName: nginx-gateway-tls-staging-mycure
        - name: https-staging-hapihub
          port: 443
          protocol: HTTPS
          hostname: "hapihub.staging.example.com"
          tlsSecretName: nginx-gateway-tls-staging-hapihub
        - name: https-staging-wildcard
          port: 443
          protocol: HTTPS
          hostname: "*.staging.example.com"
          tlsSecretName: nginx-gateway-tls-staging
        - name: http-staging-wildcard
          port: 80
          protocol: HTTP
          hostname: "*.staging.example.com"
        # Cadence QUIC (UDPRoute): staging hub port 6473, staging relay 7842.
        # No SNI on UDP — port-demuxed. publicAddr in the deployment values
        # advertises <tailnet-ip>:6473 once the tailscale device exists.
        - name: cadence-quic-staging
          port: 6473
          protocol: UDP
        - name: relay-quic-staging
          port: 7842
          protocol: UDP

  tls:
    certificates:
      # Exact-name certs for the anti-coalescing listeners above — MUST stay
      # single-hostname; adding extra dnsNames would re-enable coalescing.
      - secretName: nginx-gateway-tls-staging-mycure
        clusterIssuer: letsencrypt-production  # DNS-01
        dnsNames:
          - mycure.staging.example.com
      - secretName: nginx-gateway-tls-staging-hapihub
        clusterIssuer: letsencrypt-production  # DNS-01
        dnsNames:
          - hapihub.staging.example.com
      - secretName: nginx-gateway-tls-staging
        clusterIssuer: letsencrypt-production  # DNS-01, wildcard
        dnsNames:
          - "*.staging.example.com"
      - secretName: nginx-gateway-tls-prod
        clusterIssuer: letsencrypt-production  # DNS-01
        dnsNames:
          - "*.example.com"
      - secretName: nginx-gateway-tls-prod-app
        clusterIssuer: letsencrypt-nginx-http01  # HTTP-01 via NGINX Gateway
        dnsNames:
          - api.example.com
          - find.example.com

  # Cluster-wide SnippetsPolicies for the shared nginx Gateway.
  # Owned here (not per-app) so two releases can never inject the same
  # directive into the same nginx context — that triggers
  # "directive is duplicate" and breaks config reload.
  snippetsPolicies:
    - name: hapihub-proxy-timeout
      snippets:
        - context: http.server.location
          value: |
            proxy_read_timeout 3600s;
            client_max_body_size 50m;
    # OSS NGINX cannot suppress the `Server` response header via
    # `server_tokens` (only hides the version) and the data-plane image does
    # not bundle `headers-more`. Use the bundled njs module
    # (ngx_http_js_module) to delete the header in the response-header phase.
    # Script: charts/nginx-gateway/files/security-headers.js
    # Mount:  charts/argocd-infrastructure/templates/nginx-gateway.yaml
    - name: nginx-strip-server-header
      snippets:
        - context: http
          value: |
            js_import securityHeaders from /etc/nginx/njs-security/security-headers.js;
        - context: http.server.location
          value: |
            js_header_filter securityHeaders.clearServer;

# Gateway metadata consumed by the grafana/signoz Application templates
# (route hostname + parentRef derivation only). Both routes are disabled today
# — grafana is admin port-forward, signoz is off — so these values are inert;
# if either route is re-enabled it attaches to the nginx public gateway.
gateway:
  domain: example.com
  gateway:
    name: nginx-public-gateway
    namespace: nginx-gateway-system

# External Secrets - Secret management
externalSecrets:
  enabled: true
  version: 0.9.11

  # Name of the ClusterSecretStore the cluster-scoped ExternalSecrets
  # (cert-manager / external-dns / velero) read from — must match a store below.
  secretStoreName: aws-secretstore

  # ClusterSecretStore(s) for this cluster — a provider-tagged list piped into
  # the external-secrets-stores chart. This EKS example uses AWS Secrets Manager
  # via IRSA (the external-secrets ServiceAccount is annotated with an IAM role;
  # no static creds). Swap provider to gcp (Service Account Key / Workload
  # Identity) or azure (Key Vault + Workload Identity) — see
  # charts/external-secrets-stores/values.yaml for all three shapes.
  stores:
    - name: aws-secretstore
      provider: aws
      aws:
        region: us-east-1
        service: SecretsManager
        auth:
          jwt:
            serviceAccountRef:
              name: external-secrets
              namespace: external-secrets-system

# External DNS - Automatic DNS record management from HTTPRoutes
externalDNS:
  enabled: true  # Automatic DNS via Cloudflare

# Kyverno - Policy engine
kyverno:
  enabled: true
  version: "3.2.0"
  namespace: kyverno
  # HA: 2 replicas per controller. Admission webhooks are stateless;
  # background/reports/cleanup controllers use leader-election.
  replicas: 2
  policies:
    enabled: true
    # Availability guards: protect the client namespaces from deletion +
    # force reclaimPolicy=Retain on their PVs. These ENFORCE (unlike the
    # audit-mode security policies below) — protectNamespaces only blocks
    # DELETE of labeled namespaces, retainProtectedPV only mutates new PVs
    # bound into the listed namespaces, so enforcing is safe. List YOUR
    # protected namespaces here.
    protectNamespaces:
      enabled: true
      action: Enforce
    retainProtectedPV:
      enabled: true
      protectedNamespaces:
        - mycure-production
        - mycure-staging
    # All three ship in `audit` to start: policies are cluster-wide but
    # audit blocks nothing anywhere — it only writes PolicyReports. This
    # is the prod-safe rollout: validate against mycure-staging reports
    # first, then consider `enforce`. Flipping to enforce requires tenant
    # charts to set securityContext.runAsNonRoot (pod-security) and the
    # app/environment/client label taxonomy (require-labels) — until that
    # chart-side compliance lands, enforce would admission-deny rollouts.
    podSecurity:
      enabled: true
      action: audit
    requireLabels:
      enabled: true
      action: audit
    restrictRegistries:
      enabled: true
      action: audit

# Velero - Backup and disaster recovery
velero:
  enabled: true
  # Chart 12.0.1 ships Velero 1.18.0. Requires Velero >= 1.14.1: older
  # versions prematurely cancel DataUploads when the data-mover's expose pod
  # waits on PVC-PV binding — a slow CSI provisioner can trip that window.
  version: 12.0.1
  provider: aws

  # AWS S3 configuration
  aws:
    region: <region>  # e.g. us-east-1
    bucket: <velero-bucket>  # S3 bucket name
    roleArn: ""  # Auto-populated from terraform output (IRSA velero_role_arn)
  
  # Azure Blob Storage configuration
  azure:
    resourceGroup: ""  # Set to Azure resource group
    storageAccount: ""  # Set to storage account name
    blobContainer: ""  # Set to blob container name (e.g., velero-backups)
    subscriptionId: ""  # Optional, auto-detected if not set
    identityClientId: ""  # Auto-populated from terraform output (Workload Identity)
  
  # GCP Cloud Storage configuration
  gcp:
    bucket: ""  # Set to GCS bucket name (e.g., my-cluster-velero-backups)
    projectId: ""  # Set to GCP project ID
    region: us-central1
    serviceAccount: ""  # Auto-populated from terraform output (Workload Identity)
  
  # MinIO configuration (for K3D/local development)
  minio:
    bucket: velero-backups
    url: http://minio.velero.svc:9000
    publicUrl: http://localhost:9000
    accessKey: minio
    secretKey: minio123
  
  # Backup schedules configuration
  schedules:
    # Infrastructure namespace backups
    infrastructure:
      daily:
        enabled: true
        schedule: "0 3 * * *"  # 3 AM daily
        retention: 720h  # 30 days
      hourly:
        enabled: false  # Optional, for critical infrastructure
        schedule: "0 * * * *"  # Every hour
        retention: 72h  # 3 days
    
    # Cluster-wide resource backups
    cluster:
      weekly:
        enabled: true
        schedule: "0 4 * * 0"  # 4 AM Sunday
        retention: 2160h  # 90 days

    # Production workload backups
    production:
      daily:
        enabled: true
        schedule: "0 2 * * *"  # 2 AM daily
        # 14d, not 30d: the mycure-production Kopia repo is ~4x the single-snapshot
        # floor at 30d of daily history. 14d ~halves it on both object storage and
        # a size-constrained on-prem mirror. See docs/operations/ONPREM_BACKUP_SETUP.md.
        retention: 336h  # 14 days
        namespaces:
          - mycure-production

# Falco - Runtime security monitoring.
# Operator + custom rulesets from charts/falco-resources (api, database).
# Passive — Falco alerts, never blocks. Emits to stdout (route to SigNoz/
# Discord separately).
falco:
  enabled: true
  # Chart 4.6.1 (Falco 0.38.1) hits a libscap/modern-BPF scap_init bug on
  # recent kernels (fixed upstream in 0.39.0). Chart 9.1.0 ships Falco
  # 0.44.1 with driver.kind=modern_ebpf (CO-RE, no kernel-module build) —
  # verified against nodes on kernel 6.1 (Debian 12).
  version: "9.1.0"
  namespace: falco
  rules:
    enabled: true
    api:
      enabled: true
    database:
      enabled: true

# Monitoring - Prometheus + Grafana stack
monitoring:
  enabled: true  # Optional, enable for observability
  version: 11.x.x  # Bitnami kube-prometheus chart version
  
  # Prometheus configuration
  prometheus:
    retention: 30d  # How long to keep metrics
    storageSize: 50Gi  # Prometheus data storage
    storageClass: ""  # Auto-detect from cluster default
  
  # Grafana configuration (deployed as separate wrapper chart)
  grafana:
    enabled: true  # Enable Grafana deployment

    # Bitnami grafana subchart values (nested under 'grafana:')
    grafana:
      admin:
        user: admin
        password: admin  # Override via External Secrets in production

      # Use bitnamilegacy image (consistency with monitoring stack)
      image:
        registry: docker.io
        repository: bitnamilegacy/grafana

      resources:
        requests:
          cpu: "50m"
          memory: "150Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"

      persistence:
        enabled: true
        size: 10Gi
        storageClass: ""  # Auto-detect from cluster default

      # Dashboard provider configuration
      dashboardsProvider:
        enabled: true

      # Dashboard ConfigMaps to load
      dashboardsConfigMaps:
        - configMapName: grafana-dashboard-global
          fileName: global.json
        - configMapName: grafana-dashboard-nodes
          fileName: nodes.json
        - configMapName: grafana-dashboard-namespaces
          fileName: namespaces.json
        - configMapName: grafana-dashboard-pods
          fileName: pods.json
        - configMapName: grafana-dashboard-apiserver
          fileName: api-server.json
        - configMapName: grafana-dashboard-prometheus
          fileName: prometheus.json

    # Wrapper chart gateway configuration (not nested)
    gateway:
      # Disabled: Grafana is admin-only, reached via `kubectl port-forward`
      # (svc/grafana 3000). Dropping the HTTPRoute removes the last consumer of
      # the envoy shared-gateway — no public grafana.example.com ingress.
      enabled: false
      hostname: ""  # Uses grafana.{domain}
  
  # Alertmanager (wired into kube-prometheus via templates/monitoring.yaml).
  # Config + Postmark token are provided via the alertmanager-config ExternalSecret
  # (infrastructure/monitoring/alertmanager-config-externalsecret.yaml), NOT here,
  # because Postmark's SMTP username is the secret API token (no smtp_auth_username_file).
  alertmanager:
    enabled: true

# SigNoz - unified observability platform (metrics + traces + logs + alerting).
# Consolidation target replacing the Prometheus/Grafana/AlertManager stack above.
# Deployed via charts/signoz wrapper (argocd templates/signoz.yaml).
# Kept DISABLED until ClickHouse capacity (general pool) + go-live steps are ready;
# runs in parallel with monitoring during cutover, which is removed only after parity.
signoz:
  enabled: false

  gateway:
    # Deny-first: ops tooling stays off the public internet. Reached via
    # kubectl port-forward (or an internal-gateway route later) when enabled.
    enabled: false
    hostname: ""  # Uses signoz.{domain}

  # Upstream signoz/signoz chart values (nested under 'signoz:' for the subchart).
  # storageClass omitted on purpose -> cluster default provisioner.
  signoz:
    signoz:
      persistence:
        enabled: true
        size: 2Gi
      resources:
        requests:
          cpu: "100m"
          memory: "200Mi"
        limits:
          cpu: "1"
          memory: "1Gi"
    clickhouse:
      persistence:
        enabled: true
        size: 50Gi
      resources:
        requests:
          cpu: "200m"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
    redpanda:
      enabled: false
    postgresql:
      enabled: false

# Tenzir - self-hosted security detection pipeline ("emit, don't detect").
# A single Tenzir Node ingests hapihub audit_events over HTTP (push, all orgs),
# detects signals in TQL, and routes OCSF findings to Alertmanager (reuses the
# Discord + Postmark receivers). Deployed into the `security` ns.
#
# Requires the HMAC secret infrastructure-tenzir-ingest-hmac; hapihub POSTs
# audit_events to
# http://tenzir-ingest.security.svc.cluster.local:8080/ingest/audit-events
# (see the deployment values' hapihub AUDIT_SINK_*). geoip stays off until a
# MaxMind key is provisioned, so unusual_country/impossible_travel stay dormant.
tenzir:
  enabled: true
  # geoip stays off until the MaxMind license key is provisioned — the two geo
  # signals (unusual_country, impossible_travel) stay dormant; the other five run.
  geoip:
    enabled: false

# Tailscale egress to the medical-AI host Ollama (inference)
ollamaEgress:
  enabled: true
  tailnetFqdn: ollama.example.ts.net  # MagicDNS name of your Ollama host on the tailnet

# Tailscale K8s operator — private-network exposure for cluster services. Backs
# the nginx-internal-gateway: the internal gateway is the
# cluster-default (deny-first); public exposure is an explicit prod opt-in on
# nginx-public-gateway.
tailscaleOperator:
  enabled: true
