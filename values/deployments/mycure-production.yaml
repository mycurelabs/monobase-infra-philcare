# Production overlay over values/deployments/base.yaml (helm merge:
# base first, this file wins per key; arrays replace wholesale).
# Production Configuration
extends: base

# Overlay: global values (public gateway, prod node pool)
global:
  domain: example.com
  namespace: mycure-production
  environment: production

  # PUBLIC: client-facing prod is internet-exposed BY INTENT — the only
  # deployment allowed on the public gateway. Everything else inherits the
  # private-network-only default from base.yaml (deny-first).
  gateway:
    name: nginx-public-gateway
    namespace: nginx-gateway-system

  # Role-based pools: prod-db / prod-apps / infra / nonprod. Taints
  # (node-pool=<name>:NoSchedule) make placement enforced, not advisory.
  # The PG primary overrides to prod-db below.
  nodePool: "prod-apps"

# Strict gateway ingress: drops the baseline's blanket
# nginx-gateway-system → all-pods allow; every prod workload relies on its own
# port-scoped gateway rule. Every HTTPRoute backend must carry a matching
# NetworkPolicy (hapihub:7500, app clones:8080, hapihub-docs:8080, minio:9000;
# cadence/relay own any-source NPs) before enabling this.
securityBaseline:
  strictGatewayIngress: true

# ===== HEALTHCARE: Dashboard (operator/admin web UI) =====
mycure-dashboard:
  resources:
    requests:
      cpu: 10m
  gateway:
    sectionName: https-wildcard

  config:
    API_URL: "https://hapihub.example.com"
    HAPIHUB_URL: "https://hapihub.example.com"

# ===== HEALTHCARE: PXP (patient-facing web app) =====
mycure-pxp:
  resources:
    requests:
      cpu: 10m
  gateway:
    sectionName: https-wildcard

  config:
    API_URL: "https://hapihub.example.com"

# ===== HEALTHCARE: HapiHub API =====
hapihub:
  image:
    # A tag may be digest-pinned (tag@sha256:...) to guard against a floating
    # tag being re-pushed with a different image.
    tag: "11.20.102"
  cache:
    # Response cache OFF in prod — interim mitigation for a single-hot-key
    # cache stampede. Re-enable once serve-stale is validated for the workload.
    enabled: false

  replicaCount: 3

  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 4Gi

  gateway:
    hostnames:
      # Canonical host. Carries the cadence OAuth AS metadata
      # (token_endpoint/jwks_uri minted from EXTERNAL_ADDRESS = this host,
      # immutable = better-auth baseURL).
    - hapihub.example.com
    sectionName: https-wildcard # Use example.com HTTPS listener
    # No additionalSectionNames: not on api.example.com (Better Auth rpId is
    # example.com; api.example.com would need cross-domain cookie handling).
  betterAuth:
    passkey:
      rpName: "Mycure"
      rpId: "example.com"

  config:
    CORS_ORIGINS: "https://mycure.example.com,https://mycurelocal.example.com,https://mycure-myaccount.example.com,https://mycure-dashboard.example.com,https://mycure-pxp.example.com"
    STORAGE_DOWNLOAD_URL_HOST: "https://hapihub.example.com"
    # Background jobs (exports, email, doc-ingestion, PDF/Chromium) are moved to
    # the hapihub-worker release below — a single export/PDF job landing on an
    # API pod can balloon it toward the memory limit.
    RUN_WORKERS: "false"

  env:
    # JSC sizes heap-growth heuristics off machine RAM, not the cgroup — under
    # burst allocation the heap can overshoot the container limit before a full
    # GC runs. Force it to see 3GiB (limit is 4Gi; the remaining ~1GiB covers
    # non-JSC memory: Buffers, in-pod Chromium/export workers).
  - name: BUN_JSC_forceRAMSize
    value: "3221225472"
  - name: BETTER_AUTH_RATE_LIMIT_ENABLED
    value: "true"
  - name: BETTER_AUTH_RATE_LIMIT_WINDOW
    value: "60"
  - name: BETTER_AUTH_RATE_LIMIT_MAX
    value: "300"
  - name: BETTER_AUTH_SESSION_COOKIE_CACHE_ENABLED
    value: "false"
    # Email: Postmark transactional (OTP, magic links, verification, resets)
  - name: EMAIL_PROVIDER
    value: "postmark"
  - name: POSTMARK_API_KEY
    valueFrom:
      secretKeyRef:
        name: hapihub-secrets
        key: POSTMARK_API_KEY
  - name: EMAIL_FROM_EMAIL
    value: "no-reply@example.com"
  - name: EMAIL_FROM_NAME
    value: "MyCure"
    # cadence OAuth Authorization Server. hapihub is the SOLE AS: it mints box grants
    # AND the hub's own '*' grant with this EdDSA key. The values are advertised in
    # /.well-known/cadence-configuration.json so a box derives its sync hub (cadence_seed_url) + fleet (aud)
    # from the single api URL — single-URL onboarding. CADENCE_ISSUER_KEY (the PEM) is the externalSecret below.
  - name: CADENCE_ISSUER_ISS
    value: "cadence-production-issuer"
  - name: CADENCE_ISSUER_KID
    value: "k1"
  - name: CADENCE_ISSUER_FLEET_ID
    value: "mycure-production"
  - name: CADENCE_ISSUER_AUTHORIZE_URL
    value: "https://mycure.example.com/oauth/authorize"
  - name: CADENCE_ISSUER_SEED_URL
    value: "https://cadence.example.com"

  autoscaling:
    enabled: true
    # min 2 for HA; max 4 keeps one burst replica. The HPA idles at 2 with
    # CPU ~35% of target.
    minReplicas: 2
    maxReplicas: 4

  externalSecrets:
    secrets:
      # cadence issuer EdDSA signing key — hapihub mints box + hub grants with it.
    - secretKey: CADENCE_ISSUER_KEY
      remoteKey: mycure-production-cadence-issuer-key-pem
      # Google OAuth
    - secretKey: GOOGLE_CLIENT_ID
      remoteKey: mycure-production-google-oauth-client-id
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteKey: mycure-production-google-oauth-client-secret
    - secretKey: STRIPE_SECRET_KEY
      remoteKey: mycure-production-stripe-secret-key
      # Encryption keys
    - secretKey: ENC_BILLING_INVOICES
      remoteKey: mycure-production-enc-billing-invoices
    - secretKey: ENC_BILLING_ITEMS
      remoteKey: mycure-production-enc-billing-items
    - secretKey: ENC_BILLING_PAYMENTS
      remoteKey: mycure-production-enc-billing-payments
    - secretKey: ENC_MEDICAL_RECORDS
      remoteKey: mycure-production-enc-medical-records
    - secretKey: ENC_PERSONAL_DETAILS
      remoteKey: mycure-production-enc-personal-details
      # JWT/Auth keys
    - secretKey: PRIVATE_KEY
      remoteKey: mycure-production-private-key
    - secretKey: PUBLIC_KEY
      remoteKey: mycure-production-public-key
      # Storage configuration (GCP)
    - secretKey: STORAGE_BUCKET
      remoteKey: mycure-production-storage-bucket
    - secretKey: STORAGE_CLIENT_EMAIL
      remoteKey: mycure-production-storage-client-email
    - secretKey: STORAGE_DIRECTORY
      remoteKey: mycure-production-storage-directory
    - secretKey: STORAGE_PRIVATE_KEY
      remoteKey: mycure-production-storage-private-key
    - secretKey: STORAGE_PROJECT_ID
      remoteKey: mycure-production-storage-project-id
    - secretKey: STORAGE_TYPE
      remoteKey: mycure-production-storage-type
      # Stripe configuration
    - secretKey: STRIPE_KEY
      remoteKey: mycure-production-stripe-key
    - secretKey: STRIPE_CHECKOUT_SUCCESS_URL
      remoteKey: mycure-production-stripe-checkout-success-url
    - secretKey: STRIPE_CHECKOUT_CANCEL_URL
      remoteKey: mycure-production-stripe-checkout-cancel-url
    - secretKey: AUTH_SECRET
      remoteKey: mycure-production-auth-secret
    - secretKey: BETTER_AUTH_SECRET
      remoteKey: mycure-production-better-auth-secret
      # Email (Postmark) — OTP, magic links, verification, password resets
    - secretKey: POSTMARK_API_KEY
      remoteKey: mycure-production-postmark-api-key

  postgresql:
    serviceName: postgresql-primary

# ===== HEALTHCARE: HapiHub Worker (background jobs) =====
hapihubWorker:
  enabled: true

  replicaCount: 1

  # Explicit resources — the worker app deep-merges hapihub values, so
  # without this it would inherit the API release's 1Gi request. The worker
  # runs exports/PDF-Chromium which legitimately spike; keep a 2Gi request.
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

  config:
    RUN_WORKERS: "true"

  # No external traffic: keep the Service (probes) but no routes.
  gateway:
    enabled: false
    storageRoute:
      enabled: false
    snippetsPolicy:
      enabled: false

  # The API release owns the daily session-prune cronjob.
  pruneExpiredSessions:
    enabled: false

  # Fixed single replica — job throughput does not need an HPA, and pg-boss
  # handles multi-consumer anyway if this is ever raised.
  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: false

# ===== HEALTHCARE: Frontend (patient web app) =====
mycure:
  image:
    tag: "10.25.120"
  resources:
    requests:
      cpu: 10m
  gateway:
    sectionName: https-wildcard # Use example.com HTTPS listener

  config:
    API_URL: "https://hapihub.example.com"
    HAPIHUB_URL: "https://hapihub.example.com"
    # PostHog product analytics. Public project key (phc_...), safe to commit —
    # it ships to the browser anyway. Blank on non-prod keeps analytics off
    # there. Host blank → defaults to https://us.i.posthog.com (free plan, US).
    POSTHOG_KEY: ""
    POSTHOG_HOST: ""
    # GA4 measurement id — public, ships to the browser. Read at runtime via
    # /config.json (same as PostHog). Prod-only: leaving it unset on
    # non-prod keeps GA4 off.
    GA4_MEASUREMENT_ID: ""

# ===== HEALTHCARE: Local Frontend =====
mycurelocal:
  enabled: true

  resources:
    requests:
      cpu: 10m
  gateway:
    hostnames:
    - hostname: mycurelocal.example.com
      sectionName: https-wildcard
    - hostname: find.example.com
      sectionName: https-mycure

# ===== HEALTHCARE: MyAccount (account portal) =====
mycure-myaccount:
  enabled: true

  resources:
    requests:
      cpu: 10m
  gateway:
    sectionName: https-wildcard # Use example.com HTTPS listener

  config:
    API_URL: "https://hapihub.example.com"
    HAPIHUB_URL: "https://hapihub.example.com"

# ===== HEALTHCARE: HapiHub API Documentation =====
hapihub-docs:
  enabled: true

  resources:
    requests:
      cpu: 10m
  gateway:
    hostname: "docs.example.com"
    sectionName: https-wildcard

# ===== DATABASE: PostgreSQL (HA) =====
postgresql:
  architecture: replication

  auth:
    replicationUsername: repl_user
    secretKeys:
      replicationPasswordKey: postgres-replication-password

  primary:
    # Dedicated 1-node pool (g-4vcpu-16gb, 4 dedicated vCPU): big-box
    # onboarding syncs are CPU-bound on the primary, so it gets dedicated
    # silicon with no co-tenants.
    nodePool: "prod-db"
    persistence:
      size: 400Gi
    resources:
      requests:
        cpu: 2000m
        memory: 12Gi
      limits:
        # 3500m not 4000m: leaves ~400m for the node's daemonsets (cilium,
        # kube-proxy, velero node-agent, node-exporter) on the 4-vCPU node.
        cpu: 3500m
        memory: 12Gi  # working set ~8Gi; 12Gi gives OOM headroom
    # Perf tuning — replaces PG defaults (shared_buffers 128MB / work_mem 4MB).
    # Applying restarts the primary.
    #
    # shared_preload_libraries: keep bitnami's default 'pgaudit' and add
    # pg_stat_statements for query attribution (CREATE EXTENSION
    # pg_stat_statements in the hapihub DB on a fresh install).
    extendedConfiguration: |
      shared_preload_libraries = 'pgaudit, pg_stat_statements'
      shared_buffers = 2GB
      effective_cache_size = 5GB
      work_mem = 16MB
      maintenance_work_mem = 256MB
      random_page_cost = 1.1
      effective_io_concurrency = 200
      # 96 cadence workers connect at boot; the default 100 is too small.
      # Restart PG to apply.
      max_connections = 300
      # Log statements >=1s (also set via ALTER SYSTEM in postgresql.auto.conf).
      log_min_duration_statement = 1000
      # Autovacuum throughput: 3 workers @ cost_limit 200 (PG defaults) can't
      # keep up on a large write-heavy DB — big tables can go too long between
      # autovacuums. More workers + a higher cost budget lets it keep pace;
      # per-table scale_factor overrides on the worst offenders ship in hapihub
      # migration 0087. max_workers needs a restart (applied with this block);
      # cost_limit and naptime are reload-only.
      autovacuum_max_workers = 6
      autovacuum_vacuum_cost_limit = 2000
      autovacuum_naptime = 30s
  readReplicas:
    replicaCount: 1
    # NOTE: the read replica PVC (data-postgresql-read-0) is excluded from Velero
    # backups — it is a byte-copy of the primary, redundant for DR. The exclusion
    # is applied as a label directly on the PVC (cannot be set via this chart: a
    # StatefulSet's volumeClaimTemplate is immutable on update, so a persistence
    # label change would be rejected by the API server):
    #   kubectl -n mycure-production label pvc data-postgresql-read-0 \
    #     velero.io/exclude-from-backup=true --overwrite
    # Re-apply this label if the replica PVC is ever re-created (e.g. re-clone).
    persistence:
      enabled: true
      storageClass: ""
      size: 300Gi
    resources:
      requests:
        cpu: 500m
        memory: 4Gi
      limits:
        # The replica carries the cadence read plane; a big dense catch-up can pin
        # CPU and slow scans enough to trip the data-plane statement_timeout, so
        # give it headroom (node is prod-apps).
        cpu: 3000m
        memory: 8Gi
    # Keep the replica's config in lockstep with the primary (idle today, but
    # ready for read-offload and consistent on promotion). Restarts the replica.
    # primary_slot_name pins the replica to a persistent physical slot
    # (pg_read_replica) so the primary retains WAL until the replica consumes
    # it — prevents "WAL segment already removed" replica death. Capped on the
    # primary by max_slot_wal_keep_size=80GB so a dead replica can't fill the
    # primary disk.
    extendedConfiguration: |
      shared_preload_libraries = 'pgaudit, pg_stat_statements'
      shared_buffers = 2GB
      effective_cache_size = 5GB
      work_mem = 16MB
      maintenance_work_mem = 256MB
      random_page_cost = 1.1
      effective_io_concurrency = 200
      # 96 cadence workers connect at boot; the default 100 is too small.
      # Restart PG to apply.
      max_connections = 300
      log_min_duration_statement = 1000
      # Autovacuum GUCs kept in lockstep with the primary (inert on a hot
      # standby — autovacuum doesn't run in recovery — but consistent on
      # promotion). See primary block for rationale.
      autovacuum_max_workers = 6
      autovacuum_vacuum_cost_limit = 2000
      autovacuum_naptime = 30s
      primary_slot_name = 'pg_read_replica'
      # The replica serves the cadence read plane: long reconcile scans can be
      # canceled by WAL-replay conflicts ("conflict with recovery"). Feedback makes
      # the primary retain tuples the standby's queries still need (bloat bounded
      # by the read statement cap); the delay lets replay wait out a long scan
      # instead of killing it (lag is over-reconcile-safe for the sync plane).
      hot_standby_feedback = on
      max_standby_streaming_delay = 120s
    # Startup probe gates liveness during the initial pg_basebackup. A full
    # re-clone of a large DB can take hours — the default liveness probe would
    # SIGKILL the pod every ~90s and restart the clone forever. 180min ceiling
    # (720 * 15s).
    customStartupProbe:
      exec:
        command:
        - /bin/sh
        - -c
        - exec pg_isready -U postgres -d dbname=hapihub -h 127.0.0.1 -p 5432
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 720
      successThreshold: 1

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# ===== CACHE: Valkey (Redis) =====
valkey:
  master:
    persistence:
      size: 32Gi
    # 4Gi limit: AOF replay OOMs at 2Gi with a large AOF, and the dataset
    # grows unboundedly until change-log trimming/TTL ships. CPU at 1 core so
    # AOF replay doesn't starve the liveness probe.
    resources:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        cpu: 1000m
        memory: 4Gi
    # No --maxmemory cap: with readFrom=Pg cadence writes no Valkey
    # changelog, so the working set (seq counter, peer tokens, JWKS cache,
    # watermarks) stays under ~100 MiB at prod load. A soft cap produces
    # false OOM-as-policy events; the container limit is the ceiling. If
    # Valkey nears 4 GiB, changelog writes are back on or a new dataset
    # class arrived — we want a real signal, not an artificial OOM cycle.

# ===== STORAGE: MinIO Object Storage =====
minio:
  enabled: false

# ===== ARTIFACTS STORE: public-read MinIO (desktop-release manifests + installers) =====
minio-artifacts:
  enabled: true

  image:
    repository: bitnamilegacy/minio
    tag: "2025.7.23-debian-12-r3"

  persistence:
    # Publisher keep-5 bounds usage to ~2.5Gi, so 20Gi is generous headroom.
    # A PVC can't be shrunk in-place, so this is not reclaimed to a smaller size.
    size: 20Gi

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  gateway:
    hostname: ""  # defaults to artifacts.example.com
    sectionName: https-wildcard

# ===== EMAIL TESTING: Mailpit =====
mailpit:
  enabled: false

  gateway:
    hostname: ""

# ===== P2P SYNC: cadence-relay (self-hosted iroh relay) =====
# Own LB + cert (cadence-relay.example.com) + QUIC addr-disc (7842/UDP) so the anchor can home
# on it; the anchor advertises it and boxes run maestroapp our-relay-only.
cadenceRelay:
  nodePool: "prod-apps"
  # Whole relay on the PUBLIC gateway (no dedicated cloud LB). 443 leg via HTTPRoute +
  # BackendTLSPolicy; QUIC leg via UDPRoute on relay-quic-prod (iroh default 7842). The
  # in-cluster anchor reaches the relay via the coredns hairpin → this Service's ClusterIP.
  # Cut over OFF-HOURS: a mid-day cutover makes the full online fleet reconnect in one
  # synchronized herd and flood the relay; off-hours the morning power-on ramp is staggered.
  serviceType: ClusterIP
  gatewayRoute:
    enabled: true
    hostname: cadence-relay.example.com
    sectionName: https-wildcard
    udpListener: relay-quic-prod

# ===== P2P SYNC: Cadence (iroh QUIC sync hub) =====
# The anchor hub. Reachability via the shared gateway's UDPRoute. Watches the
# LIVE hapihub app DB: installs cadence_* side-tables + capture triggers on the
# live tables at startup and baselines existing rows.
cadence:
  publicAddr: "<shared-lb-ip>:6472"
  # relayUrl empty ⇒ n0's public relay (chart default). Set to a self-hosted
  # relay URL only if that relay's HTTP-upgrade handshake survives the gateway
  # path (a TLS-terminate + re-encrypt can mangle the long-lived iroh upgrade,
  # and a dead relay path makes the hub tight-loop into OOM).
  relayUrl: ""
  nodePool: "prod-apps"
  # /healthz + /readyz serve off a DEDICATED OS thread so the liveness probe
  # stays prompt regardless of sync-runtime saturation (a long cache-wall scan
  # can otherwise pin all tokio workers and starve the healthz future → SIGKILL).
  image:
    tag: "2.1.103"
  # Read-idle: how long a catch-up serve stream stays alive on an idle read. 600s
  # keeps the hub from killing serves on slow single large frame bodies
  # (keepalives bridge inter-frame idle, not intra-frame). The payload-BYTE budget
  # bounds concurrent live payload regardless of stream lifetime.
  readIdleMs: 600000
  # LeafIds resident budget. Downgrades the uncapped LeafIds-delta to windowed
  # Leaf = bounded materialization regardless of box push. Keep explicit to pin
  # the value in case the image rolls back to a default that OOMs the hub.
  leafidsGlobalBudget: 150000
  # Concurrency cap: the LeafIds budget bounds rows PER serve but NOT summed live
  # payload BYTES across simultaneous serves. Many concurrent fat serves can spike
  # the live-set and OOM the hub; capping bounds concurrent payload (boxes queue).
  maxConcurrentServes: 8
  # Prod-only bump: the 3Gi chart default OOMKills (exit 137) during prod-scale
  # baseline/reconcile scans — idle working set is small but full-fleet
  # scans spike far past it. Burst
  # ceiling only, requests stay 1Gi; size to your node (prod-apps nodes are 16Gi
  # so 13Gi fits, tight — do not raise further without a node right-size).
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 13Gi
  postgresql:
    serviceName: postgresql-primary
    # Read-plane split: the hub's reconcile/serve scan queries go to the replica
    # via CADENCE_DB_READ_URL; writes + LWW admission reads stay on the primary —
    # keeps heavy scans off the write path.
    readServiceName: postgresql-read
  gateway:
    sectionName: https-wildcard
    hostnames:
    - cadence.example.com
    # QUIC via the shared gateway (UDPRoute). Prod keeps canonical port 6472 on the
    # shared LB IP.
    udpListener: cadence-quic-prod
  # hapihub is the SOLE AS (mints box grants + the hub's own '*' grant). The enroll initContainer
  # authorizes '*' against the programmatic /sync/authorize with the service-account API key (--bearer);
  # runtime grant verification is against hapihub's JWKS.
  auth:
    issuerUrl: https://hapihub.example.com
    grantJwksUri: https://hapihub.example.com/.well-known/jwks.json
    fleetId: mycure-production
    authorizeUrl: https://hapihub.example.com/sync/authorize
  # Service-account API key (better-auth, service@example.com, non-expiring) → secret cadence-secrets.
  # `mycure-production-cadence-sa-api-key` is provisioned in GCP Secret Manager; the hub presents it as --bearer.
  externalSecrets:
    secrets:
    - secretKey: sa-api-key
      remoteKey: mycure-production-cadence-sa-api-key

