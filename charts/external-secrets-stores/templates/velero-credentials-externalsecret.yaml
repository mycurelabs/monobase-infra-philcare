{{- if .Values.velero.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: velero-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secretStoreName | default "gcp-secretstore" }}
    kind: ClusterSecretStore
  target:
    name: velero-credentials
    creationPolicy: Owner
    template:
      data:
        cloud: |
          [default]
          aws_access_key_id={{ "{{" }} .objectStoreAccessKey }}
          aws_secret_access_key={{ "{{" }} .objectStoreSecretKey }}
  data:
    # S3-compatible object storage credentials for the Velero backup bucket
    # (AWS S3, DO Spaces, MinIO, etc.). Rename the remoteRef key to match your
    # entry in the secret backend.
    - secretKey: objectStoreAccessKey
      remoteRef:
        key: {{ .Values.veleroObjectStoreSecret | default "velero-object-store-credentials" }}
        property: access_key
    - secretKey: objectStoreSecretKey
      remoteRef:
        key: {{ .Values.veleroObjectStoreSecret | default "velero-object-store-credentials" }}
        property: secret_key
{{- end }}
