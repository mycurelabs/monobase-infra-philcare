# Default values for the app chart (generic frontend/service)
# Override these values in deployments/{env}/values.yaml

global:
  domain: example.com
  namespace: example-prod
  environment: production
  gateway:
    name: shared-gateway
    namespace: gateway-system

enabled: true

replicaCount: 2

image:
  repository: ghcr.io/mycurelabs/mycureapp
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101  # caddy-k8s user
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

gateway:
  enabled: true
  hostname: ""  # Empty = uses {release-name}.{global.domain}

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 1Gi

livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Node pool scheduling (optional, disabled by default)
# Inherits from global.nodePool if configured
# nodePool:
#   enabled: false     # Set to false to explicitly disable (overrides global)
#   name: "staging"    # Override global node pool name

nodeSelector: {}
tolerations: []
affinity: {}

# Frontend configuration (passed as environment variables)
config: {}

# Non-frontend extension (default no-op → frontends render unchanged). Lets the
# generic app chart host a plain Deployment service (e.g. an s3proxy) instead of
# only a Caddy static frontend:
#   extraEnv       - raw env entries (supports valueFrom.secretKeyRef) appended to config
#   envFrom        - envFrom list (secretRef/configMapRef)
#   caddyVolumes   - the built-in tmp/caddy-data/caddy-config emptyDirs (RO rootfs).
#                    Set false for images that need a writable rootfs / no Caddy dirs.
#   volumes/volumeMounts - custom volumes for non-frontend workloads
extraEnv: []
envFrom: []
caddyVolumes: true
volumes: []
volumeMounts: []

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics

# Optional features (rendered only when enabled)
externalSecrets:
  enabled: false
persistence:
  enabled: false
# app.kubernetes.io/part-of label. Empty => inherit global.partOf (set by the
# tenant in values/), falling back to "platform". Tenant identity lives in values/.
partOf: ""
