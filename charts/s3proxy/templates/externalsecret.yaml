{{- if and .Values.enabled .Values.externalSecrets.enabled }}
# Creates the k8s Secret named `minio` (via fullnameOverride) with the four
# keys s3proxy + hapihub both read:
#   root-user, root-password    (S3 identity — root-password minted in-cluster
#                                by the Password generator in password-generator.yaml)
#   backend-identity,
#   backend-identity, backend-credential  (backend account + secret key, from the ESO store)
#
# ponytail: root-user is the s3Identity value (not a secret — usernames
# aren't). root-password is minted once by ESO's Password generator so no
# external KV write is needed for a purely internal-to-cluster identity.
# refreshInterval: 0 keeps the generated password stable (ESO re-invokes
# the generator on every reconcile otherwise, which would rotate the
# credential and break hapihub's S3 client).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "s3proxy.fullname" . }}-credentials
  namespace: {{ include "s3proxy.namespace" . }}
  labels:
    {{- include "s3proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-secrets
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore | default "azure-secretstore" }}
    kind: {{ .Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
  target:
    name: {{ include "s3proxy.fullname" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        root-user: {{ .Values.s3Identity | quote }}
        root-password: {{ `"{{ .password }}"` }}
        backend-identity: {{ `"{{ .backendIdentity }}"` }}
        backend-credential: {{ `"{{ .backendCredential }}"` }}
  data:
    - secretKey: backendIdentity
      remoteRef:
        key: {{ .Values.externalSecrets.backendIdentityKey | required "externalSecrets.backendIdentityKey is required" }}
    - secretKey: backendCredential
      remoteRef:
        key: {{ .Values.externalSecrets.backendCredentialKey | required "externalSecrets.backendCredentialKey is required" }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "s3proxy.fullname" . }}-s3cred
{{- end }}
