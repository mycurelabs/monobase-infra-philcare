{{- if and (eq .Values.velero.provider "azure") (eq (.Values.velero.azure.authMode | default "workload-identity") "storage-account-key") }}
# Builds the velero-credentials secret (key `cloud`, dotenv format read by
# velero-plugin-for-microsoft-azure) from a storage-account access key in the
# fork's ESO store — no dedicated backup identity. The Azure BSL points at this
# via storageAccountKeyEnvVar. Only rendered for provider=azure + storage-account-key.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: velero-credentials
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/component: credentials
spec:
  {{- $es := .Values.velero.externalSecrets | default dict }}
  refreshInterval: {{ $es.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $es.secretStore | default "azure-secretstore" }}
    kind: {{ $es.secretStoreKind | default "ClusterSecretStore" }}
  target:
    name: velero-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        cloud: |
          AZURE_STORAGE_ACCOUNT_ACCESS_KEY={{ `{{ .azureKey }}` }}
          AZURE_CLOUD_NAME=AzurePublicCloud
  data:
    - secretKey: azureKey
      remoteRef:
        key: {{ $es.azureBlobKeyKey | required "velero.externalSecrets.azureBlobKeyKey is required when velero.azure.authMode=storage-account-key" }}
{{- end }}
