{{- if .Values.valkey.enabled }}
# ArgoCD Application: Valkey (Redis Cache)
# Sync Wave 2 - Deploy cache before applications

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.global.namespace }}-valkey
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # Bitnami moved to OCI-only distribution in 2025; the legacy HTTPS catalog
    # (charts.bitnami.com) is shrinking and returns "invalid_reference" for newer
    # charts — so default to the OCI registry, PINNED (a floating 2.x.x drifts a
    # stateful cache silently). Override repo/version per fork.
    chart: valkey
    repoURL: {{ .Values.valkey.chartRepo | default "registry-1.docker.io/bitnamicharts" }}
    # 2.2.1 ships valkey 8.0.1; chart 3.0+ defaults to valkey 9.x (needs a subchart
    # re-audit before bumping a major).
    targetRevision: {{ .Values.valkey.chartVersion | default "2.2.1" }}
    helm:
      releaseName: valkey
      valuesObject:
        {{- if and .Values.valkey.global .Values.valkey.global.security }}
        global:
          security:
            allowInsecureImages: {{ .Values.valkey.global.security.allowInsecureImages | default false }}
        {{- end }}
        image:
          repository: {{ .Values.valkey.image.repository | default "bitnamilegacy/valkey" }}
          tag: {{ .Values.valkey.image.tag | default "8.0.1-debian-12-r2" }}
        architecture: {{ .Values.valkey.architecture | default "standalone" }}
        {{- if .Values.valkey.auth }}
        auth:
          enabled: true
          existingSecret: {{ .Values.valkey.auth.existingSecret | default "valkey" }}
        {{- end }}
        primary:
          persistence:
            enabled: {{ .Values.valkey.master.persistence.enabled | default false }}
            storageClass: {{ .Values.valkey.master.persistence.storageClass | default "" }}
            size: {{ .Values.valkey.master.persistence.size | default "8Gi" }}
          {{- if .Values.valkey.master.resources }}
          resourcesPreset: "none"
          resources: {{ .Values.valkey.master.resources | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.valkey.master.extraFlags }}
          extraFlags: {{ .Values.valkey.master.extraFlags | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.global.nodePool }}
          nodeSelector:
            node-pool: {{ .Values.global.nodePool }}
          tolerations:
            - key: "node-pool"
              operator: "Equal"
              value: {{ .Values.global.nodePool | quote }}
              effect: "NoSchedule"
          {{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.global.namespace }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 5m
{{- end }}
