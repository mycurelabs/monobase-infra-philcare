---
name: security

# Report-only CI: quality linters (defined in mise) + static security scanning.
# NOTHING blocks a merge (soft-fail / exit-code 0) — deploys stay ArgoCD GitOps.
# If code scanning is enabled on the repo, SARIF uploads to the Security tab
# (with an artifact backup, and continue-on-error so a disabled tab can't red
# the run).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"   # nightly full-tree sweep
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Quality gates — the existing mise linters, now in CI (report-only). Cheapest
  # real win: tflint (aws/azurerm/google) + yamllint + shellcheck + helm render +
  # markdownlint. `validate` (6x `terraform init`) is intentionally skipped here
  # to keep CI fast — run `mise run validate` locally.
  # ---------------------------------------------------------------------------
  quality:
    name: quality (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install mise + pinned tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: true
          cache: true

      # GITHUB_TOKEN authenticates the plugin downloads — unauthenticated
      # api.github.com hits the 60/hr rate limit and 403s. continue-on-error so a
      # transient hiccup can't red this report-only job.
      - name: tflint --init (install ruleset plugins)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init --config="${GITHUB_WORKSPACE}/.tflint.hcl"

      - name: mise run lint (report-only)
        continue-on-error: true
        run: mise run lint

  # ---------------------------------------------------------------------------
  # Trivy — IaC misconfiguration (config scan) over Terraform + Helm + K8s.
  # Complements runtime Falco/security-baseline (static only; no in-cluster operator).
  # ---------------------------------------------------------------------------
  trivy-config:
    name: trivy (IaC misconfig)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Trivy config scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          hide-progress: "true"

      - name: Trivy config scan (table to job log)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml
          format: table
          exit-code: "0"
          hide-progress: "true"

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-config

      - name: Upload SARIF (artifact backup)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # OSV-Scanner — dependency vulns for this repo's own bun.lock + TS deps.
  # ---------------------------------------------------------------------------
  osv-scan:
    name: osv-scanner (deps)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install OSV-Scanner
        run: |
          curl -sSL -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: OSV-Scanner (SARIF)
        continue-on-error: true
        run: osv-scanner --recursive --format=sarif --output-file=osv-results.sarif ./

      - name: OSV-Scanner (table to job log)
        if: always()
        continue-on-error: true
        run: osv-scanner --recursive ./

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

      - name: Upload SARIF (artifact backup)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osv-sarif
          path: osv-results.sarif
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # TruffleHog — secret scanning. This repo is the highest-value secret target
  # (cloud creds, kubeconfigs). --results=verified => only live-confirmed creds.
  # A one-time full-history sweep is run manually out of band.
  # ---------------------------------------------------------------------------
  trufflehog:
    name: trufflehog (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # needs history to diff base..head

      - name: TruffleHog (verified, report-only)
        continue-on-error: true
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --results=verified
